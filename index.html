h1,h2,h3{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold-l); outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .fade-enter{animation:fadeIn .28s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}

/* ---- Start-Bildschirme (Sprache / Rolle) ---- */
.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 20px;position:relative}
.stage.cover{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0;background:#050a10;overflow:hidden}
.stage-photo{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;object-position:center top;display:block}
.stage-panel{flex:none;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0a1a13 0,#081109 100%);overflow-y:auto}
.stage-panel .stage-note{margin-top:0}
.stage-btnrow{display:flex;gap:8px}
.stage-btnrow .stage-btn{flex:1;min-height:54px;font-size:14.5px;padding:0 6px;margin-bottom:0}
.stage-btnrow .stage-btn.withcrest{flex-direction:column;gap:4px;padding:6px 4px}
.stage-btnrow .stage-btn.withcrest img{height:20px}
@media (orientation:landscape){
  .stage.cover{flex-direction:row}
  .stage-photo{flex:0 0 44%;height:100%;width:auto;max-width:44%}
  .stage-panel{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center}
}
.stage-in{position:relative;z-index:2}
.stage-btn.withcrest{display:flex;align-items:center;justify-content:center;gap:12px}
.stage-btn.withcrest img{height:30px;width:auto;display:block}
.stage-in{max-width:400px;width:100%;text-align:center}
.stage-in svg{width:52px;height:52px;display:block}
.stage-trophy{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.stage-trophy .tflag{font-size:28px;line-height:1}
.stage-title{font:900 26px var(--serif);letter-spacing:.12em;color:var(--gold-l)}
.stage-sub{font-size:15px;color:var(--muted);margin:4px 0 24px}
.stage-note{font-size:14.5px;color:var(--muted);margin:0 0 20px;line-height:1.5}
.stage-btn{display:block;width:100%;min-height:58px;margin-bottom:12px;border-radius:14px;border:2px solid var(--gold);background:transparent;color:var(--ink);font:700 17px var(--sans);cursor:pointer}
.stage-btn.pri{background:linear-gradient(180deg,#ecc96a,#b98a2e);color:#1a1005;border-color:var(--gold-l)}
.stage-btn[disabled]{opacity:.4;cursor:not-allowed}
.pwbox{margin-top:6px;text-align:left}
.pwerr{color:#ff9aa8;font-size:14.5px;margin:6px 0 10px}
.backln{background:none;border:0;color:var(--muted);font:600 14px var(--sans);text-decoration:underline;cursor:pointer;margin-bottom:16px}

.stickytop{position:sticky;top:0;z-index:5}
.top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#12301e,#0f2419);border-bottom:1px solid var(--line)}
.scorebar{display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 14px;background:linear-gradient(180deg,#0f2a1b,#0d2417);border-bottom:1px solid var(--line)}
.scorebar .sbcrest{height:24px;width:auto;display:block}
.scorebar .sbname{font:600 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.scorebar .sbp{font:900 21px var(--serif);color:var(--gold-l);min-width:1.3em;text-align:center}
.scorebar .sbsep{color:var(--gold);font-weight:700;font-size:15px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.top svg{flex:none}
.hdr-trophy{display:flex;align-items:center;gap:3px;flex:none}
.hdr-trophy .tflag{font-size:13px;line-height:1}
.hdr-trophy button.tflag{background:none;border:0;padding:9px;margin:-9px;cursor:pointer;display:inline-flex;border-radius:8px}
.hdr-trophy button.tflag:active{background:rgba(217,180,90,.18)}
.tflag svg,.celflag svg{height:1em;width:auto;display:block;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.brand{flex:1;min-width:0}
.brand h1{font:900 21px/1.1 var(--serif);letter-spacing:.14em;color:var(--gold-l)}
.brand .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--gold-l);white-space:nowrap;background:rgba(6,16,26,.5)}
.chip.warn{border-color:var(--red);color:#ffb3bd}
.dot{width:9px;height:9px;border-radius:50%;background:#59d08a;display:inline-block}
.dot.off{background:#e2475e}
.dot.wait{background:var(--gold)}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.role{display:block;margin-left:auto;background:none;border:0;padding:0;font-size:12.5px;color:var(--muted);text-align:right;text-decoration:underline;cursor:pointer;font-family:inherit}
.hdrlinks{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:3px}

main{max-width:560px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
h2.pg{font:900 18px/1.2 var(--serif);letter-spacing:.1em;color:var(--gold-l);margin:6px 2px 4px}
p.lead{margin:0 2px 8px;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 20px rgba(0,0,0,.22)}
.dayh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 2px 10px}

function combineTeamHandicap(chList) {
  /* Formel bestaetigt: Durchschnitt der beiden Spieler-Course-Handicaps - gegen 2 von 3 echten
     Auswahldrive-Beispielen aus dem Vereinscomputer exakt nachgerechnet. Das dritte Beispiel

  var valid = chList.filter(function (x) { return x != null; });

}

/* ================= Platz & Vorgabe ================= */
function courseOf(day) { return COURSES[day] || COURSES.d1; }

function teeOf(c, k) { return (c.tees && c.tees[k]) || c.tees.h; }
function parTotal(c) { return c.par.reduce(function (a, b) { return a + b; }, 0); }
var HCP_CAP = 36; /* Vorgabe pro Spieler turnierueblich auf max. 36 gedeckelt */
function courseHandicap(hi, c, teeKey) {
  if (hi == null) return null;
  var t = teeOf(c, teeKey);
  return Math.min(hi * (t.slope / 113) + (t.cr - parTotal(c)), HCP_CAP);
}
function playingHandicap(ch, fmt) {
  if (ch == null) return null;
  return Math.round(ch * (FMT_PCT[fmt] != null ? FMT_PCT[fmt] : 1.0));
}

  if (ph == null) return 0;
  var sign = ph < 0 ? -1 : 1, n = Math.abs(ph), base = Math.floor(n / 18), rem = n % 18;
  return sign * (base + (si <= rem ? 1 : 0));
}

  var f = parseFloat(v); return isFinite(f) ? f : null;
}
function matchPlayers(m) {

  var t = [{ name: m.pt1, hi: m.hit1, tee: m.gt1 || 'h' }]; if (!one) t.push({ name: m.pt2, hi: m.hit2, tee: m.gt2 || 'h' });
  var h = [{ name: m.ph1, hi: m.hih1, tee: m.gh1 || 'h' }]; if (!one) h.push({ name: m.ph2, hi: m.hih2, tee: m.gh2 || 'h' });

}

/* ================= Datenbank (REST + Server-Sent Events) ================= */
function baseUrl() { return DB_URL.replace(/\/+$/, '') + '/events/' + encodeURIComponent(CODE); }
function segs(path) { return String(path).split('/').filter(Boolean); }

function applyLocal(path, val) {
  var p = segs(path);
  if (!p.length) { tree = (val && typeof val === 'object') ? val : {}; return; }
  var node = tree, chain = [];
  for (var i = 0; i < p.length - 1; i++) {
    if (node[p[i]] == null || typeof node[p[i]] !== 'object') { if (val == null) return; node[p[i]] = {}; }
    chain.push([node, p[i]]); node = node[p[i]];
  }
  var last = p[p.length - 1];
  if (val == null) delete node[last]; else node[last] = val;
  for (var j = chain.length - 1; j >= 0; j--) {
    var par = chain[j][0], key = chain[j][1];
    if (par[key] && typeof par[key] === 'object' && !Object.keys(par[key]).length) delete par[key]; else break;
  }
}
function rest(method, path, body) {
  if (DEMO) return;
  var opt = { method: method };
  if (body !== undefined) opt.body = JSON.stringify(body);
  fetch(baseUrl() + path + '.json', opt).then(function (r) { if (!r.ok) throw new Error(r.status); })
    .catch(function () { toast(S.errWrite); });
}
function dbSet(path, val) {
  applyLocal(path, val === undefined ? null : val); touch(path);
  rest(val == null ? 'DELETE' : 'PUT', path, val == null ? undefined : val);
  render();
}
function dbPatch(path, obj) {
  Object.keys(obj).forEach(function (k) { applyLocal(path + '/' + k, obj[k]); });
  touch(path);
  rest('PATCH', path, obj);
  render();
}
function touch(path) {
  var t = Date.now();
  applyLocal('/meta/updated', t);
  if (!DEMO && path !== '/meta/updated') fetch(baseUrl() + '/meta/updated.json', { method: 'PUT', body: String(t) }).catch(function () {});
}

var es = null, hideTimer = null, retryTimer = null;
function connect() {
  if (DEMO || !CODE || NEWMODE || ui.stage !== 'app') return;
  try { if (es) es.close(); } catch (e) { /* egal */ }
  ui.conn = 'connecting'; render();
  es = new EventSource(baseUrl() + '.json');
  es.onopen = function () { ui.conn = 'online'; render(); };
  es.addEventListener('put', function (e) {
    var d = JSON.parse(e.data);
    applyLocal(d.path, d.data);
    ui.conn = 'online'; render();
  });
  es.addEventListener('patch', function (e) {
    var d = JSON.parse(e.data), base = d.path === '/' ? '' : d.path;
    Object.keys(d.data || {}).forEach(function (k) { applyLocal(base + '/' + k, d.data[k]); });
    render();
  });
  es.addEventListener('cancel', function () { ui.conn = 'offline'; render(); });
  es.onerror = function () {
    ui.conn = 'offline'; render();
    if (es.readyState === 2) { clearTimeout(retryTimer); retryTimer = setTimeout(connect, 5000); }
  };
}
document.addEventListener('visibilitychange', function () {
  if (DEMO || !CODE || ui.stage !== 'app') return;
  if (document.hidden) {
    hideTimer = setTimeout(function () { try { es && es.close(); } catch (e) { /* egal */ } ui.conn = 'offline'; }, 60000);
  } else {
    clearTimeout(hideTimer);
    if (!es || es.readyState === 2) connect();
  }
});

/* ================= Spiel-Logik (Lochspiel) ================= */
function holes() { return 18; }
function matchList() {
  var ms = tree.matches || {};
  return Object.keys(ms).map(function (id) { var m = ms[id]; m.id = id; return m; });
}
function getMatch(id) { var m = (tree.matches || {})[id]; if (m) m.id = id; return m; }
function dayMatches(dayId) {
  return matchList().filter(function (m) { return m.day === dayId; })
    .map(function (m, i) { return { m: m, i: i }; })
    .sort(function (a, b) { var ta = a.m.time || '99:99', tb = b.m.time || '99:99'; return ta < tb ? -1 : ta > tb ? 1 : (a.m.id < b.m.id ? -1 : 1); })
    .map(function (x) { return x.m; });
}
function numbering() { var map = {}, n = 0; DAYS.forEach(function (d) { dayMatches(d.id).forEach(function (m) { map[m.id] = ++n; }); }); return map; }

function mstate(m) {
  var H = holes(), s = m.s || {}, t = 0, h = 0, played = 0, next = 0;
  for (var n = 1; n <= H; n++) {
    var r = s['h' + n];
    if (r) { played++; if (r === 'T') t++; else if (r === 'H') h++; } else if (!next) next = n;
  }
  var thru = next ? next - 1 : H, lead = t - h, rem = H - thru;
  var st = { H: H, t: t, h: h, played: played, thru: thru, next: next, lead: lead, rem: rem, k: 'live', w: '', fin: '' };
  if (!played) st.k = 'none';
  else if (Math.abs(lead) > rem) { st.k = 'final'; st.w = lead > 0 ? 'T' : 'H'; st.fin = rem > 0 ? Math.abs(lead) + '&' + rem : Math.abs(lead) + ' UP'; }
  else if (!next) { st.k = 'final'; st.w = 'D'; }
  st.dormie = st.k === 'live' && lead !== 0 && Math.abs(lead) === rem;
  var live = st.k === 'none' ? [0.5, 0.5] : st.k === 'final' ? (st.w === 'T' ? [1, 0] : st.w === 'H' ? [0, 1] : [0.5, 0.5]) : (lead > 0 ? [1, 0] : lead < 0 ? [0, 1] : [0.5, 0.5]);
  st.pt = live; st.pf = st.k === 'final' ? live : [0, 0];
  return st;
}
function totals(list) {
  var r = { t: 0, h: 0, ft: 0, fh: 0, fin: 0, live: 0, n: 0 };
  list.forEach(function (m) {
    var st = mstate(m); r.n++;
    r.t += st.pt[0]; r.h += st.pt[1]; r.ft += st.pf[0]; r.fh += st.pf[1];
    if (st.k === 'final') r.fin++; else if (st.k === 'live') r.live++;
  });
  return r;
}
function championOf() {
  var all = matchList(); if (!all.length) return null;
  var T = totals(all), target = T.n / 2 + 0.5;
  if (T.ft >= target) return 'T'; if (T.fh >= target) return 'H'; return null;
}

  for (var i = 0; i < DAYS.length; i++) if (DAYS[i].iso === iso) return DAYS[i].id;
  return DAYS[0].id;
}

}
function players(m, side) {
  var n = m.fmt === 'single' ? 1 : 2, out = [];
  for (var i = 1; i <= n; i++) {
    var v = String(m[(side === 't' ? 'pt' : 'ph') + i] || '').trim();
    out.push('<div>' + (v ? esc(v) : '<span class="none">' + S.none + '</span>') + '</div>');
  }
  return out.join('');
}
function strip(m) {
  var H = holes(), s = m.s || {}, html = '<div class="strip" aria-hidden="true">';
  for (var n = 1; n <= H; n++) html += '<i class="hs ' + (s['h' + n] || '') + '"></i>';
  return html + '</div>';
}
function midOf(st) {
  if (st.k === 'none') return '<div class="big n">\u2013</div><div class="sm">' + esc(S.notStartedShort) + '</div>';
  if (st.k === 'final') {
    if (st.w === 'D') return '<div class="big d">A/S</div><div class="sm">' + esc(S.halvedFinal) + '</div>';
    return '<div class="big ' + st.w.toLowerCase() + '">' + esc(st.fin) + '</div><div class="sm">' + esc(S.finalWord) + '</div>';
  }

  return '<div class="big ' + cls + '">' + txt + '</div><div class="sm">' + esc(S.afterHoles(st.thru)) + (st.dormie ? ' \u00b7 ' + esc(S.dormie) : '') + '</div>';

function trophyFlagged(cls, size, clickable) {
  var svg = size ? TROPHY.replace('width="34" height="34"', 'width="' + size + '" height="' + size + '"') : TROPHY;

    return clickable

      : '<span class="tflag" aria-hidden="true">' + flagSvg + '</span>';

    var one = d[1] === 'single', n = idx + 1;
    var m = { day: d[0], fmt: d[1], pt1: 'Spieler T' + n + (one ? '' : 'a'), ph1: 'Spieler H' + n + (one ? '' : 'a'),
      hit1: sampleHi[idx % 8], hih1: sampleHi[(idx + 3) % 8] };
    if (!one) { m.pt2 = 'Spieler T' + n + 'b'; m.ph2 = 'Spieler H' + n + 'b'; m.hit2 = sampleHi[(idx + 1) % 8]; m.hih2 = sampleHi[(idx + 5) % 8]; }
    if (withHoles && progress[idx]) {
      m.s = {}; var lead = 0;
      for (var h = 1; h <= progress[idx]; h++) {
        var r = rnd(), v = r < 0.36 ? 'T' : r < 0.72 ? 'H' : 'D'; m.s['h' + h] = v;
        lead += v === 'T' ? 1 : v === 'H' ? -1 : 0;

appEl.addEventListener('submit', function (e) {

appEl.addEventListener('click', function (e) {

    if (k === 'lang') { LANG = st.dataset.v; S = STR[LANG]; lsSet('rc_lang_' + EFFCODE, LANG); ui.stage = 'role'; render(); }
    else if (k === 'role') { setRole(st.dataset.v); }

    return;
  }
  var b = e.target.closest('[data-a]'); if (!b) return;
  var a = b.dataset.a, id = b.dataset.id;
  if (a === 'setlang') { LANG = b.dataset.v; S = STR[LANG]; lsSet('rc_lang_' + EFFCODE, LANG); render(); return; }
  if (a === 'tab') { ui.tab = b.dataset.tab; ui.focus = 'tab-' + ui.tab; render(); window.scrollTo(0, 0); }
  else if (a === 'day') { ui.day = b.dataset.day; ui.focus = 'day-' + ui.day; render(); }
  else if (a === 'open') openDetail(id);
  else if (a === 'add') openEdit(null, b.dataset.day);
  else if (a === 'bulk') openBulk(b.dataset.day);
  else if (a === 'edit') openEdit(id);
  else if (a === 'sample') loadSample();
  else if (a === 'realdata') askConfirm('Echte Paarungen (' + REALDATA.length + ' Spiele) jetzt eintragen?', loadRealData);
  else if (a === 'resetres') askConfirm(S.confirmResetRes, function () { matchList().forEach(function (m) { if (m.s) dbSet('/matches/' + m.id + '/s', null); }); });
  else if (a === 'delall') askConfirm(S.confirmDelAll, function () { dbSet('/matches', null); });
  else if (a === 'celebrate') { var w = championOf(); if (w) openCelebration(w); }
  else if (a === 'switchrole') { ui.stage = 'role'; ui.pwRole = null; ui.pwErr = false; render(); }
  else if (a === 'backapp') { ui.stage = 'app'; render(); }
  else if (a === 'newcode') { ui.newCode = randomCode(); render(); }

function randomCode() {
  var chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789', out = '', a = new Uint32Array(20);
  (window.crypto || window.msCrypto).getRandomValues(a);
  for (var i = 0; i < 20; i++) out += chars[a[i] % chars.length];
  return out;
}
